[colors]
background = #282828
foreground = #ebdbb2
primary = #fabd2f
secondary = #34d87e
alert = #fb4934

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 24
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2
padding-right = 1

font-0 = "JetBrainsMono Nerd Font:style=SemiBold:size=10;2"

modules-left = bspwm i3
modules-center = xwindow
modules-right = tray

tray-position = right
tray-padding = 2

[bar/secondary]
monitor = ${env:MONITOR:}
width = 100%
height = 24
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2
padding-right = 1

font-0 = "JetBrainsMono Nerd Font:style=SemiBold:size=10;2"

modules-left = bspwm i3
modules-center = date
modules-right = memory temperature pipewire-audio network-eth network-wifi tray

tray-position = right
tray-padding = 2

[module/bspwm]
type = internal/bspwm
label-focused = %index%
label-focused-background = ${colors.primary}
label-focused-padding = 2
label-occupied = %index%
label-occupied-padding = 2
label-urgent = %index%
label-urgent-background = ${colors.alert}
label-urgent-padding = 2
label-empty = %index%
label-empty-foreground = #555
label-empty-padding = 2

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
wrapping-scroll = false
label-mode-padding = 2
label-mode-foreground = ${colors.foreground}
label-mode-background = ${colors.primary}
label-focused = %index%
label-focused-background = ${colors.secondary}
label-focused-padding = 2
label-unfocused = %index%
label-unfocused-padding = 2
label-visible = %index%
label-visible-background = ${colors.secondary}
label-visible-padding = 2
label-urgent = %index%
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

[module/xwindow]
type = internal/xwindow
label = %title:0:50:...%

[module/tray]
type = custom/text
content = ""

[module/pipewire-audio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = " 󰕾 %percentage%%"
label-muted = " 󰖁 muted"

[module/memory]
type = internal/memory
interval = 2
format-prefix = "󰍛 "
label = %used% / %total%

[module/network-eth]
type = internal/network
interface = enp3s0
interval = 3.0
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-connected = " 󰈀  %local_ip%"
label-disconnected = " 󰈀  down"

[module/network-wifi]
type = internal/network
interface = wlp4s0
interval = 3.0
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-connected = " 󰖩  %local_ip%"
label-disconnected = " 󰖩  down"

[module/date]
type = internal/date
interval = 1
date = "%d-%m-%Y"
time = "%I:%M:%S %p"
format-prefix = " 󰃭 "
label = %date% %time%

[module/temperature]
type = internal/temperature
thermal-zone = 0
warn-temperature = 60
format = <label>
format-warn = <label-warn>
label = " 󰏈  %temperature-c%"
label-warn = " 󰏈  %temperature-c%"
label-warn-foreground = ${colors.alert}

[settings]
screenchange-reload = true

[global/wm]
margin-top = 0
margin-bottom = 0